<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="35%" stop-color="#0A1F3D"/>
      <stop offset="72%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6D5DFB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="blurGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="0" fill="url(#bg)"/>

  <!-- background grid -->
  <g opacity="0.12">
    <!-- vertical -->
    <path d="M80 0V420M180 0V420M280 0V420M380 0V420M480 0V420M580 0V420M680 0V420M780 0V420M880 0V420M980 0V420M1080 0V420M1180 0V420M1280 0V420M1380 0V420M1480 0V420" stroke="white" stroke-width="1"/>
    <!-- horizontal -->
    <path d="M0 60H1600M0 120H1600M0 180H1600M0 240H1600M0 300H1600M0 360H1600" stroke="white" stroke-width="1"/>
  </g>

  <!-- glow blobs -->
  <circle cx="1240" cy="110" r="120" fill="#38BDF8" opacity="0.18" filter="url(#blurGlow)"/>
  <circle cx="1460" cy="80" r="95" fill="#8B5CF6" opacity="0.18" filter="url(#blurGlow)"/>
  <circle cx="1350" cy="310" r="130" fill="#22D3EE" opacity="0.12" filter="url(#blurGlow)"/>

  <!-- left mini dashboard -->
  <g transform="translate(74,72)" filter="url(#softShadow)">
    <rect x="0" y="0" width="290" height="276" rx="24" fill="url(#panel)" stroke="rgba(255,255,255,0.16)"/>
    <text x="28" y="40" fill="#D9E7F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Painel de dados</text>

    <g opacity="0.95">
      <rect x="28" y="62" width="110" height="70" rx="16" fill="#07111F" stroke="#2B4C74"/>
      <text x="44" y="88" fill="#8CB9E6" font-family="Inter, Arial, sans-serif" font-size="12">SQL</text>
      <text x="44" y="114" fill="white" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">CTEs</text>

      <rect x="152" y="62" width="110" height="70" rx="16" fill="#07111F" stroke="#2B4C74"/>
      <text x="168" y="88" fill="#8CB9E6" font-family="Inter, Arial, sans-serif" font-size="12">Python</text>
      <text x="168" y="114" fill="white" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">EDA</text>

      <rect x="28" y="146" width="234" height="102" rx="16" fill="#07111F" stroke="#2B4C74"/>
      <text x="44" y="170" fill="#8CB9E6" font-family="Inter, Arial, sans-serif" font-size="12">Fluxo analítico</text>

      <path d="M46 217 C78 210, 94 180, 125 184 C158 188, 170 222, 199 203 C222 188, 236 161, 246 156" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="46" cy="217" r="4.5" fill="#67E8F9"/>
      <circle cx="125" cy="184" r="4.5" fill="#38BDF8"/>
      <circle cx="199" cy="203" r="4.5" fill="#38BDF8"/>
      <circle cx="246" cy="156" r="4.5" fill="#818CF8"/>
    </g>
  </g>

  <!-- main text -->
  <g transform="translate(430,98)">
    <text x="0" y="30" fill="#9CC8F1" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">BEN</text>
    <text x="0" y="110" fill="white" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="1">FERRARI</text>
    <rect x="0" y="134" width="510" height="2" rx="1" fill="url(#accent)" opacity="0.95"/>
    <text x="0" y="178" fill="#D7E5F5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Analista de Dados • SQL • Python • Power BI</text>
    <text x="0" y="218" fill="#8FB4D8" font-family="Inter, Arial, sans-serif" font-size="17">Transformando dados em clareza, contexto e decisão.</text>

    <g transform="translate(0,254)">
      <rect x="0" y="0" width="148" height="38" rx="19" fill="#0B203C" stroke="#27547F"/>
      <text x="25" y="24" fill="#EAF5FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">SQL</text>

      <rect x="160" y="0" width="148" height="38" rx="19" fill="#0B203C" stroke="#27547F"/>
      <text x="185" y="24" fill="#EAF5FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Python</text>

      <rect x="320" y="0" width="148" height="38" rx="19" fill="#0B203C" stroke="#27547F"/>
      <text x="338" y="24" fill="#EAF5FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Power BI</text>
    </g>
  </g>

  <!-- right abstract chart / decorative panel -->
  <g transform="translate(1210,164)" filter="url(#softShadow)">
    <rect x="0" y="0" width="280" height="160" rx="26" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
    <text x="28" y="34" fill="#DCE9F6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Clareza analítica</text>

    <g opacity="0.9">
      <line x1="30" y1="128" x2="250" y2="128" stroke="#294D75"/>
      <line x1="30" y1="98" x2="250" y2="98" stroke="#203A58"/>
      <line x1="30" y1="68" x2="250" y2="68" stroke="#203A58"/>

      <rect x="48" y="90" width="22" height="38" rx="8" fill="#1D4ED8"/>
      <rect x="88" y="74" width="22" height="54" rx="8" fill="#0EA5E9"/>
      <rect x="128" y="56" width="22" height="72" rx="8" fill="#38BDF8"/>
      <rect x="168" y="40" width="22" height="88" rx="8" fill="#67E8F9"/>
      <rect x="208" y="27" width="22" height="101" rx="8" fill="#818CF8"/>
    </g>
  </g>
</svg>
