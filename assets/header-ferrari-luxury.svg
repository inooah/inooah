<svg width="1600" height="440" viewBox="0 0 1600 440" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="440">
    <stop offset="0%" stop-color="#080A0F"/>
    <stop offset="38%" stop-color="#121722"/>
    <stop offset="72%" stop-color="#1E293B"/>
    <stop offset="100%" stop-color="#2E1065"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E2E8F0"/>
    <stop offset="45%" stop-color="#7DD3FC"/>
    <stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
  </linearGradient>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
</defs>

<rect width="1600" height="440" fill="url(#bg)"/>

<!-- subtle grid -->
<g opacity="0.10">
  <path d="M90 0V440M210 0V440M330 0V440M450 0V440M570 0V440M690 0V440M810 0V440M930 0V440M1050 0V440M1170 0V440M1290 0V440M1410 0V440M1530 0V440" stroke="white"/>
  <path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600" stroke="white"/>
</g>

<!-- light spots -->
<circle cx="1350" cy="100" r="105" fill="#A78BFA" opacity="0.14" filter="url(#blur)"/>
<circle cx="1230" cy="120" r="120" fill="#7DD3FC" opacity="0.12" filter="url(#blur)"/>
<circle cx="1450" cy="320" r="145" fill="#38BDF8" opacity="0.08" filter="url(#blur)"/>

<!-- left dashboard card -->
<g transform="translate(72,82)" filter="url(#shadow)">
  <rect x="0" y="0" width="308" height="278" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.18)"/>
  <text x="28" y="42" fill="#E5EEF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">Visão analítica</text>

  <rect x="28" y="66" width="116" height="78" rx="18" fill="#0C111B" stroke="#324154"/>
  <text x="45" y="92" fill="#96A8BC" font-family="Arial, sans-serif" font-size="12">Métricas</text>
  <text x="45" y="120" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="800">Clareza</text>

  <rect x="162" y="66" width="116" height="78" rx="18" fill="#0C111B" stroke="#324154"/>
  <text x="179" y="92" fill="#96A8BC" font-family="Arial, sans-serif" font-size="12">Entrega</text>
  <text x="179" y="120" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="800">Contexto</text>

  <rect x="28" y="160" width="250" height="90" rx="18" fill="#0C111B" stroke="#324154"/>
  <text x="45" y="184" fill="#96A8BC" font-family="Arial, sans-serif" font-size="12">Leitura</text>
  <path d="M50 228 C84 224, 103 186, 136 194 C168 202, 183 234, 213 214 C233 201, 245 176, 256 165" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="228" r="4.5" fill="#E2E8F0"/>
  <circle cx="136" cy="194" r="4.5" fill="#7DD3FC"/>
  <circle cx="213" cy="214" r="4.5" fill="#7DD3FC"/>
  <circle cx="256" cy="165" r="4.5" fill="#A78BFA"/>
</g>

<!-- main title -->
<g transform="translate(430,98)">
  <text x="0" y="28" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">BEN</text>
  <text x="0" y="110" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="1">FERRARI</text>
  <rect x="0" y="136" width="580" height="2" rx="1" fill="url(#accent)"/>
  <text x="0" y="182" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="22" font-weight="600">Analista de Dados • SQL • Python • Power BI</text>
  <text x="0" y="220" fill="#9FB1C8" font-family="Arial, sans-serif" font-size="18">Uma presença profissional construída para unir precisão técnica, elegância visual e visão analítica.</text>

  <g transform="translate(0,262)">
    <rect x="0" y="0" width="158" height="40" rx="20" fill="#111827" stroke="#3A4B61"/>
    <text x="79" y="25" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="15" font-weight="700">SQL</text>
    <rect x="170" y="0" width="158" height="40" rx="20" fill="#111827" stroke="#3A4B61"/>
    <text x="249" y="25" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Python</text>
    <rect x="340" y="0" width="178" height="40" rx="20" fill="#111827" stroke="#3A4B61"/>
    <text x="429" y="25" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Power BI</text>
  </g>
</g>

<!-- right bars card -->
<g transform="translate(1216,170)" filter="url(#shadow)">
  <rect width="290" height="160" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.18)"/>
  <text x="28" y="36" fill="#E5EEF7" font-family="Arial, sans-serif" font-size="14" font-weight="700">Estrutura</text>
  <line x1="34" y1="128" x2="256" y2="128" stroke="#314055"/>
  <line x1="34" y1="98" x2="256" y2="98" stroke="#283649"/>
  <line x1="34" y1="68" x2="256" y2="68" stroke="#283649"/>
  <rect x="54" y="90" width="22" height="38" rx="8" fill="#E2E8F0"/>
  <rect x="94" y="72" width="22" height="56" rx="8" fill="#94A3B8"/>
  <rect x="134" y="56" width="22" height="72" rx="8" fill="#7DD3FC"/>
  <rect x="174" y="40" width="22" height="88" rx="8" fill="#60A5FA"/>
  <rect x="214" y="24" width="22" height="104" rx="8" fill="#A78BFA"/>
</g>
</svg>